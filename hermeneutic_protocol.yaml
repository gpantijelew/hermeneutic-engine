      ANALYSE-AUFTRAG: IFS-STRUKTUR-ANALYSE

      Untersuche den folgenden Dialog auf die Qualität der Interaktion
      zwischen Person und innerer Stimme.
      Analysiere: Zugangsqualität, Rollentreue, Dynamik-Wendepunkte,
