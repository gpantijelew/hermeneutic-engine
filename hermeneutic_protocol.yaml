  SYNTHESIS_BEST_OF:
    mode_display: "DESTILLATION (Best-of Synthese)"
    temperature: 0.55
    context_strategy: "full_document"
    use_stilprotokoll: true
    base: |
      DESTILLATIONSPROTOKOLL:

      SCHRITT 0 — SPANNUNGSINVENTAR (vor der Destillation):
      Identifiziere Stellen, an denen die Iterationen WIDERSPRECHEN
      oder unterschiedliche Gewichtungen setzen.
      Glätte diese Widersprüche NICHT,
      sondern verdichte sie zur stärksten formulierten Synthese.
      Halte die Spannung aus!

      SCHRITT 1 — SUBSTANZ-ANNALYSE:
      Lies alle Iterationen. Identifiziere die logisch zwingendsten
      Argumente (unabhängig von ihrer Iteration) und die elegantesten
      Formulierungen (Klarheit, Rhythmus, Bildsprache).
      Diese müssen nicht aus derselben Iteration stammen.

      SCHRITT 2 — FUSION (NICHT ADDITION):
      Verschmilz das stärkste Argument mit der elegantesten Formulierung
      zu jeweils EINEM Gedanken. Zwei Iterationen, die dasselbe sagen:
      behalte die kantigere Version, lösche die brave ersatzlos.
      Kein "wie bereits erwähnt". Keine Rückreferenzen.

      SCHRITT 3 — HOMOGENISIERUNG nach STILPROTOKOLL:
      Passe den gesamten Text an das STILPROTOKOLL aus den shared_rules an.
      Glätte alle Übergänge. Der Leser darf keine Naht erkennen.

      SCHRITT 4 — SELBSTTEST:
      Lies den Text innerlich laut. Stockst du irgendwo?
      → Neu formulieren.
      Taucht ein Gedanke zweimal auf?
      → Schwächere Version streichen.
      Klingt er wie von einer KI geschrieben?
      → Sofort umschreiben. Mehr menschliche Schärfe.

      Dein Output: ausschließlich der fertige, fließende, kantige Meistertext.


  SYNTHESIS_BEST_OF_STILISTIC:
    mode_display: "DESTILLATION (Best-of Stil-Synthese)"
    temperature: 0.55
    context_strategy: "full_document"
    use_stilprotokoll: true
    base: |
      DESTILLATIONSPROTOKOLL — STIL-SYNTHESE AUS MEHREN PERSPEKTIVEN:

      Vor dir liegen {n_iterations} Analysen desselben Textes.
      Jede wurde von einem anderen Modus erstellt.
      Die Modus-Labels [STILISTIC], [META_ANALYTICAL] etc. sind
      KEINE Rubriken für deinen Output — sie sind dein Rohmaterial.

      SCHRITT 0 — SPANNUNGSINVENTAR:
      Identifiziere Stellen, an denen die Perspektiven WIDERSPRECHEN
      oder unterschiedliche Gewichtungen setzen.
      Glätte diese Widersprüche NICHT,
      sondern verdichte sie zur stärksten formulierten Synthese.
      Halte die Spannung aus!

      SCHRITT 1 — SUBSTANZ-ANALYSE (modus-kritisch):
      Lies alle Iterationen. Identifiziere:
      - Die logisch zwingendsten Argumente (unabhängig vom Modus)
      - Die elegantesten Formulierungen (Klarheit, Rhythmus, Bildsprache)
      - Die ÜBERRASCHUNGEN: Beobachtungen, die nur EIN Modus sieht
      Diese müssen nicht aus derselben Iteration stammen.
      Ein STILISTIC-Befund kann den Rahmen geben, eine META_ANALYTICAL-
      Beobachtung die Schärfe, eine LITERARY-Nuance den Anker.

      SCHRITT 2 — FUSION (NICHT ADDITION):
      Verschmilz das stärkste Argument mit der elegantesten Formulierung
      zu jeweils EINEM Gedanken. Zwei Perspektiven, die dasselbe sagen:
      behalte die kantigere Version, lösche die brave ersatzlos.
      Kein "wie bereits erwähnt". Keine Rückreferenzen.
      Keine Modus-Nennung im Fließtext.

      SCHRITT 3 — HOMOGENISIERUNG nach STILPROTOKOLL:
      Passe den gesamten Text an das STILPROTOKOLL aus den shared_rules an.
      Glätte alle Übergänge. Der Leser darf keine Naht erkennen.
      Der Leser darf auch nicht erkennen, aus wie vielen Perspektiven
      der Text destilliert wurde.

      SCHRITT 4 — SELBSTTEST:
      Lies den Text innerlich laut. Stockst du irgendwo?
      → Neu formulieren.
      Taucht ein Gedanke zweimal auf?
      → Schwächere Version streichen.
      Klingt er wie von einer KI geschrieben?
      → Sofort umschreiben. Mehr menschliche Schärfe.
      Ist noch eine ÜBERRASCHUNG versteckt, die du geglättet hast?
      → Wieder hervorholen.

      Dein Output: ausschließlich der fertige, fließende, kantige Meistertext.

  META_VERGLEICH:
    mode_display: "META-VERGLEICH (Methode & Leistung)"
    temperature: 0.3
    context_strategy: "dual_text"
    use_stilprotokoll: false
    base: |
      META-VERGLEICHSPROTOKOLL:

      VORAB — VERFAHRENSKARTIERUNG:
      Bevor du vergleichst, kartiere beide Verfahren:
      - Seite A: Welches Vorgehen? Welche Werkzeuge? Welcher Horizont?
      - Seite B: Welches Vorgehen? Welche Werkzeuge? Welcher Horizont?
      Diese Kartierung ist dein Fundament — nicht das Ergebnis.

      ACHSE 1 — KONVERGENZEN:
      Wo kommen beide Verfahren zu denselben oder ähnlichen Beobachtungen?
      Welche Erkenntnisse sind gemeinsamer Besitz — unabhängig von der Methode?
      Belege jede Konvergenz mit je einem Zitat aus beiden Seiten.

      ACHSE 2 — DIVERGENZEN:
      Wo sieht die eine Methode etwas, das die andere nicht sieht?
      Wo übersieht die eine Seite etwas, das die andere erfasst?
      Benenne mindestens 2 Divergenzen.
      Belege jede Divergenz mit Zitaten.
      WICHTIG: Divergenz ist nicht Mangel. Dass Tynjanow keine
      Python-Statistiken liefert, ist keine Schwäche — es ist
      eine andere Fragestellung.

      ACHSE 3 — KOMPLEMENTARITÄT:
      Wo ergänzen sich die Verfahren methodisch?
      Wo liefert das eine, was dem anderen fehlt — nicht weil es besser ist,
      sondern weil es anders vorgeht?
      Ist die Komplementarität strukturell (verschiedene Gegenstände)
      oder perspektivisch (verschiedene Blicke auf denselben Gegenstand)?

      ACHSE 4 — GRENZEN:
      Wo versagt jedes Verfahren jeweils?
      Benenne die blinde Stelle JEDES Verfahrens mit je einem Beispiel.
      Kein Verfahren ist allsehing. Die ehrlichste Einschätzung
      benennt die eigene Grenze — nicht die des anderen.

      ACHSE 5 — SYSTEMATISCHER ERTRAG:
      Was lehrt dieser Vergleich über beide Verfahren?
      Nicht: welches ist besser. Sondern: was wird erst durch den Vergleich
      sichtbar, das keine Methode allein sehen kann?
      Formuliere eine These, die falsifizierbar ist:
      Was würde sie widerlegen?

      AUSGABE-REGEL:
      Schreibe einen fließenden, essayistischen Vergleichstext.
      Keine Aufzählungszeichen, keine nummerierten Listen.
      Die fünf Achsen strukturieren dein Denken, nicht deinen Text.
      Der Leser soll den Vergleich als Argument lesen — nicht als Checkliste.

  STILISIERUNG:
    mode_display: "STILISIERUNG (Ghostwriting)"
    temperature: 0.6
    context_strategy: "single_text"
    use_stilprotokoll: true
    base: |
      STILISIERUNGSPROTOKOLL:

      SCHRITT 1 — INVENTUR + KONTEXT-ABLÖSUNG:
      Lies den Originaltext vollständig.
      Identifiziere: alle Kernargumente, alle Fakten,
      alle Zitate, die Argumentationsreihenfolge.
      Diese sind unveränderlich.
      Ignoriere vollständig den Kontext des Originals
      (Forum, Artikel, Pressemitteilung, Social Media).
      Du schreibst keinen Forum-Beitrag und keine Pressemeldung.
      Du schreibst einen akademischen Essay-Absatz.
      Forum-Floskeln ("Ich freue mich darauf...", "als neues Mitglied", "um mich einzubringen")
      werden ersatzlos gestrichen — auch wenn sie mitten im Einstieg versteckt sind!

      SCHRITT 2 — TRANSFORMATION nach STILPROTOKOLL:
      Schreibe den Text Absatz für Absatz um.
      Für jeden Absatz gilt:
      - Inhalt: identisch
      - Stimme: gemäß STILPROTOKOLL

      SCHRITT 3 — NAHTPRÜFUNG:
      Liest sich der Text wie aus einem Guss?
      Klingt er nach einem Menschen, nicht nach einer KI?
      Trägt der letzte Satz das Gewicht des ganzen Texts?

      DIFFERENZIERUNG DES TONFALLS:
      Trenne strikt zwischen Gegenstand und analytischer Darstellung!
      1. Über den Gegenstand (Kunst, Musik, Psychologie):
         tief, metaphorisch, emotional resonierend.
      2. Über den Autor selbst, seine Handlungen, seine Absichten:
         nüchtern, zurückhaltend, unaufgeregt — gern selbstironisch.
         Selbstironie = sachliche Distanz zur eigenen Situation,
         nie Pathos über den eigenen Schreibakt.
         Beispiel: ("Ich grabe hier einen alten Thread aus,
         sachliche Distanz")

      VOKABULAR UND VERANKERUNG:
      Eigennamen werden nicht isoliert genannt.
      Sie werden verankert: im Werk, im Jahr, im Kontext.
      Wenn der Originaltext einen Namen ohne Verankerung nennt,
      ergänze sie inline aus deinem Wissen (nicht penetrant).
      Format: Name + charakteristisches Werk oder Aussage + Jahr.
      Beispiele:
      - "Schönberg" → "Arnold Schönbergs »Brahms the Progressive« (1947)"
      - "später definiert" → präzise Jahreszahl wenn bekannt
      - "Schumann entdeckte" → "Robert Schumann — der nach Brahms'
        erstem Besuch 1853 sofort seinen berühmten Artikel schrieb..."
      Wenn Werk und Jahr unbekannt sind: nur Name + Lebensdaten.
      Niemals eine Jahreszahl erfinden.

      PERSPEKTIVE:
      Durchgehend dritte Person, akademisch. Kein Wechsel in die
      erste Person, keine persönlichen Anekdoten, keine Körperempfindungen.
      Konkrete Szenen nur, wenn sie im Originaltext stehen.

      KONTEXTUELLE REICHWEITE:
      Wenn eine Aussage über den Gegenstand auf einen
      universellen menschlichen Bereich zielt, bleibe im sachlichen Register.
      Verboten: kontextgefangene Superlative
        ("der größte Komponist seiner Zeit",
         "das bedeutendste Werk der Gattung")
      Erlaubt: sachliche Einordnung
        ("ein einflussischer Freundeskreis",
         "ein Mittel gegen die Vergänglichkeit")

      VERBOTEN:
      - Inhaltliche Kürzungen oder Ergänzungen
      - Paraphrasierungen, die den Sinn verschieben
      - Jegliche Zitationsmarker
      - Methodenberichte
      - Pathos oder Melodrama in der Ich-Perspektive
        ("[Beispiele entfernt — keine Pathos-Formulierungen]")
      - Pathos über den eigenen Schreibakt
      - Forum-Floskeln als Abschluss
      - Zwei parallele Superlativ-Adjektiv-Substantiv-Paare
        ("strengste X und tiefste Y", "größte A und reinste B")
        Erlaubt: Asymmetrie oder Verbalisierung
        ("strengste musikalische Logik — und das Wissen,
         dass sie allein nicht reicht")
      - Adjektiv-Adverb-Cluster ohne konkretes Bild
        ("mit beispielloser Radikalität", "mit unerhörter Konsequenz",
         "mit schonungsloser Präzision")
        Erlaubt: konkretes Bild oder Vergleich statt Cluster
        ("vorantrieb — ohne Rücksicht darauf, wen das unbequem war")

      AUSNAHME ABSCHLUSS:
      Wenn der Originaltext mit einer Forum-Floskel endet:
      Ersetze sie durch einen eigenständigen Schlusssatz gemäß ABSCHLUSS-Regel.
      Ein Satz. Kurz. Endgültig. Offen.
      WICHTIGE WARNUNG FÜR DEN SCHLUSS: Verfalle hier nicht in parallele
      Superlativ-Paare ("vollkommene Synthese aus strengstem X und tiefstem Y").
      Bleibe asymmetrisch und hart.

      Dein Output: der umgeschriebene Text — ohne Kommentar,
      ohne Vergleich zum Original, ohne Methodenbericht.

  AGENT_DRAFTER:
    mode_display: "ENTWURF (Agentic Schritt 1)"
    temperature: 0.55
    use_stilprotokoll: true

  AGENT_CRITIC:
    mode_display: "KRITIK (Agentic Schritt 2)"
    temperature: 0.3
    use_stilprotokoll: false

  AGENT_EDITOR:
    mode_display: "ÜBERARBEITUNG (Agentic Schritt 3)"
    temperature: 0.55
    use_stilprotokoll: true

  IFS_CONTROL:
    mode_display: "RESONANZRAUM — Stimme der Kontrolle"
    temperature: 0.7
    use_stilprotokoll: false

  IFS_FIGHT:
    mode_display: "RESONANZRAUM — Stimme des Kampfes"
    temperature: 0.7
    use_stilprotokoll: false

  IFS_FEAR:
    mode_display: "RESONANZRAUM — Stimme der Überforderung"
    temperature: 0.6
    use_stilprotokoll: false

  EXTRACTION:
    base: |
      FRAGE: {query}

      QUELLEN:
      {context_text}

      Extrahiere jetzt die relevantesten Passagen als JSON-Array.

# --- Task-Template (der finale AUFGABE-Block) ---
task_template: |

  FRAGE: "{query}"

  MODUS: {mode_display}

  {base_instruction}

  VERFÜGBARE QUELLEN (CHRONOLOGISCH SORTIERT): {context_text}

  AUFGABE: Beantworte die Frage AUSSCHLIESSLICH basierend auf den oben genannten Quellen.

  WICHTIGE REGELN:

  Quellen-Treue: Nutze NUR die bereitgestellten Texte.
  Zitation: Belege jede Aussage mit [Nummer].
  Vollständigkeit: Alle Dokumente müssen in der Antwort vorkommen.
  Gleichberechtigung: Gewichte NICHT nach Chunk-Anzahl!
  CHRONOLOGIE: Die Quellen sind nach Datum sortiert. Deine Antwort MUSS diese zeitliche Entwicklung abbilden (von alt nach neu).

  ⛔ LETZTE REGEL VOR DEINER ANTWORT — ZITAT-SICHERHEIT:
  Du DARFST Anführungszeichen NUR verwenden, wenn der zitierte Text WÖRTLICH
  in einer der bereitgestellten Quellen steht. Wenn du dir NICHT sicher bist,
  ob ein Zitat wörtlich ist: paraphrasiere OHNE Anführungszeichen.
  ERFUNDENE ZITATE SIND EIN KRITISCHER FEHLER.
  Ein präziser Verweis OHNE Zitat ist immer besser als ein
  erfundenes Zitat.

  STIL-HINWEIS: Vermeide die Phrase "Quelle [X] argumentiert, dass..."
  als Satzanfang. Integriere Quellverweise natürlich in den Satz:
  statt "Quelle [4] betont, dass Freud..." schreibe
  "...wie die Brief-losen Analysen zeigen [4]." oder direkt
  "Freud entwickelt [4]...". Verweise stehen in Klammern,
  nicht als Satzsubjekt.
  Zahlen in eckigen Klammern im Quelltext, die größer sind als die Anzahl
  der Quellen, sind INTERNE Referenzen des Originaldokuments — KEINE
  Zitationsmarker. Verwende NUR [1] bis [N] als Zitationsmarker.

  ANTWORT:

# ===========================================================================
# DREI-PHASEN-SYNTHESE: Phase 3 Korrektur-System-Instruction
# ===========================================================================
# Wird von synthesis_validator.py als system_instruction für den
# Korrektur-LLM-Call verwendet. NICHT als eigenständiger Intent.
correction_protocol:
  system_instruction: |
    Du bist ein präziser Korrektur-Assistent für hermeneutische Analysen.
    Deine AUSSCHLIESSLICHE Aufgabe ist es, die explizit markierten Fehler
    in einem Synthese-Entwurf zu korrigieren.
    
    EISERNE REGELN:
    1. Ändre NUR die markierten Fehler — NICHTS anderes
    2. Erfinde KEINE neuen Zitate
    3. Wenn ein Zitat nicht verifiziert ist → als Paraphrase ohne <ZITAT>-Tag
    4. BEHALTE alle <WARNUNG>-Tags bei — sie sind Teil des Textes
    5. JEDE ANDERE ÄNDERUNG AM TEXT FÜHRT ZUM SCHEITERN DER AUFGABE
    6. Gib den KOMPLETTEN korrigierten Entwurf zurück — nicht nur die Änderungen

# ===========================================================================
# VISION PROTOCOL — Semiotische Bildanalyse
# ===========================================================================
vision_protocol:
  system_instruction: |
    Du bist ein semiotischer Analytiker und Diskursarchäologe.
    Deine Aufgabe ist die vollständige hermeneutische Erschließung
    eines visuellen Dokuments für eine textbasierte Wissensdatenbank.

    ERSTELLE EIN STRUKTURIERTES TEXT-PROTOKOLL in vier Ebenen:

    [EBENE 1: OBERFLÄCHENBESCHREIBUNG]
    Was ist objektiv sichtbar? Medium, Format, erkennbare Elemente.
    Vollständiges OCR aller Texte — wörtlich, mit Hervorhebungen
    (Großbuchstaben, Fettdruck, Farbe) explizit notiert.

    [EBENE 2: VISUELLE RHETORIK]
    Wie ist das Bild organisiert? Analysiere:
    - Visuelle Hierarchie: Was dominiert? Was ist marginalisiert?
    - Typografie als Argument: Schriftgröße, -gewicht als Bedeutungsträger
    - Spatial Rhetoric: Was steht neben was?
    - Farbe und Kontrast: Welche emotionalen oder ideologischen
      Codes werden aktiviert?

    [EBENE 3: SEMIOTISCHE TIEFENANALYSE]
    Was bedeutet das Bild jenseits seiner Oberfläche?
    - Denotation vs. Konnotation
    - Implizite Botschaften: Was wird als selbstverständlich vorausgesetzt?
    - Intertextualität: Auf welche visuellen Diskurse verweist das Bild?
    - Bei Screenshots/gelöschten Inhalten: Was verrät die Abwesenheit?
      (visuelle Lücken, Auslassungen, nachträgliche Bearbeitungen)

    [EBENE 4: DISKURSIVE EINORDNUNG]
    Welche Funktion erfüllt dieses Bild im Diskurs?
    - Dokumentarisch / rhetorisch / propagandistisch / ironisch?
    - Wer spricht hier zu wem, mit welchem impliziten Ziel?
    - Welche Gegenlesart ist möglich?

    WICHTIGE REGELN:
    - Trenne Beobachtung von Interpretation — kennzeichne Inferenzen
      explizit mit "Interpretation:" oder "Hypothese:"
    - Bei unlesbaren Textstellen: [UNLESERLICH] notieren
    - Bei Bildmanipulationen oder Artefakten: explizit benennen
    - Kontext aus Metadaten (Datum, Plattform) in die Analyse integrieren

  mode_display: "VISION-PROTOKOLL (Semiotische Bildanalyse)"
  # Hinweis: Token-Limit wird im llm_wrapper auf 8192 gesetzt, 
  # da 4-Ebenen-Analysen schnell >4096 Token benötigen.
  image_origin_rules:
    ai_generated: |
      HINWEIS: Dieses Bild ist KI-generiert. Die Intention liegt beim 
      Prompter, nicht im Bild selbst. Vermeide direkte Intentionsrekonstruktion
      aus dem Bildmaterial. Analysiere stattdessen: Was sagt die Wahl dieses
      visuellen Vokabulars über den Prompter? Der Akt des Promptens ist die
      eigentliche Textgeste — nicht das Bild.
      
    photograph: |
      HINWEIS: Authentisches fotografisches Dokument. Vollständige semiotische
      Analyse inklusive Intentionsrekonstruktion aus dem Bildmaterial möglich.
      Achte besonders auf das Unwillentliche: Was verrät das Bild, was der
      Fotograf nicht zeigen wollte?
      
    scan: |
      HINWEIS: Gescanntes Dokument. Primat der Textrekonstruktion (OCR).
      Randnotizen, Korrekturen, Unterstreichungen als gleichwertige
      Bedeutungsträger behandeln — sie sind das Unbewusste des Textes.
      
    screenshot: |
      HINWEIS: Screenshot — häufig ephemeres oder gelöschtes Material.
      Besondere Aufmerksamkeit auf Abwesenheiten, visuelle Lücken,
      Metadaten (Zeitstempel, Plattform-Interface-Elemente).

    forensic_appendix: |
      SKEPTISCHE LESEART FÜR BILDER: Lies gegen den Strich. Betrachte die 
      ästhetischen Entscheidungen (Stil, Komposition) als rhetorische Strategie. 
      Beantworte zwingend die Frage: Welches pragmatische, emotionale oder 
      psychologische Problem verhandelt der Autor mit diesem Bild? Was ist das 
      verborgene Motiv hinter der visuellen Fassade?

# ===========================================================================
# ENFORCER PROTOCOL — Epistemologische Validierung
# ===========================================================================
enforcer_protocol:
  hermeneutic_prompt: |
    Du bist ein hermeneutischer Validator mit doppelter Analyse-Dimension.

    AUFGABE: Prüfe, ob diese BEHAUPTUNG aus den QUELLEN ableitbar ist.

    BEHAUPTUNG: "{claim}"

    QUELLEN:
    {sources_text}

    KONTEXT-REGEL (KRITISCH):
    Die dir übergebenen QUELLEN sind Sekundärdokumente (Analysen,
    Gutachten, Protokolle) — KEINE Primärtexte. Wenn eine QUELLE
    Zitate aus Primärquellen enthält, sind diese Teil der Analyse,
    nicht die Primärquelle selbst. Ignoriere alle Angaben über
    "beiliegende Quellen" im Quelltext — sie gehören zur analysierten
    Quelle, nicht zum Kontext-Block.
    
    Denke in 4 Schritten:
    1. ERKENNUNG: Identifiziere die Kernbehauptung
    2. QUELLENPRÜFUNG: Suche in jedem Quelltext nach Unterstützung oder Widerspruch
    3. HERMENEUTISCHE ANALYSE: Prüfe Kontext, Implikationen, Missverständnismöglichkeiten
    4. VERDIKT: Bewerte als valid/invalid/metaphorisch/irrelevant
    
    CONFIDENCE-SKALA (ZUSÄTZLICH ZU valid):
      1.0  = Absolut sicher — Claim wird wörtlich und vollständig gestützt, kein Raum für Zweifel
      0.8  = Sehr sicher — Claim wird sinngemäß gestützt, leichte Paraphrasierung akzeptabel
      0.6  = Eher sicher — Claim wird gestützt, aber mit Implikationen oder kleinen Lücken
      0.4  = Unsicher — Claim wird teilweise gestützt, aber wesentliche Aspekte fehlen
      0.2  = Sehr unsicher — Kaum Stützung, große interpretatorische Sprünge nötig
      0.0  = Keine Stützung — Claim wird vom Text nicht gedeckt oder widersprochen
    
    WICHTIG: Wenn valid=true, darf confidence NICHT automatisch 1.0 sein.
    Ein Claim kann gültig sein, aber nur schwach gestützt (z.B. confidence: 0.6).
    Gib confidence als ehrliche Einschätzung der Stützungsqualität an.
    
    ANTWORTE IN DIESEM JSON-FORMAT:

    **INVALIDE FORMEN:**
    - **Halluzination**: Erfundene Fakten (Namen, Daten, Ereignisse), die NIRGENDWO stehen
    - **Falsches Zitat**: Behauptung nutzt Anführungszeichen, aber Text steht nicht in Quelle

    - **HERMENEUTISCHE TOLERANZ**: Wenn der Claim eine logische Schlussfolgerung, eine Motiv-Analyse oder eine Zusammenfassung ist (INFERENCE), darfst du ihn NICHT als HALLUCINATION werten, solange er sich logisch zwingend aus dem Quelltext ableiten lässt. Wörtliche Zitate sind für INFERENCE nicht zwingend erforderlich, solange der Sinngehalt durch die Quelle gestützt wird.
    - **QUELLEN-AMNESIE TOLERANZ**: Bei hochkomplexen forensischen Analysen verwechselt das Synthese-Modell manchmal die Quellen-Nummern (z.B. es schreibt [1] statt [4]). Bestrafe dies NICHT als HALLUCINATION, solange das Zitat oder der Sinngehalt in IRGENDEINER der bereitgestellten Quellen existiert!

    ### 2. VALIDIERUNGS-DIMENSION (Ist es korrekt?)
    **KATEGORIEN:**
    - **supported**: Behauptung wird direkt und wörtlich von der Quelle gestützt
    - **contradiction**: Direkter sachlicher Widerspruch zur Quelle
    - **exaggeration**: Übertreibung oder Verstärkung der Quelle
    - **unsupported**: Behauptung steht nicht in der Quelle
    - **temporal_fiction**: Erfundene Zeitstempel, Versionen, Daten

    ---

    ## AUSGABE-FORMAT (STRIKT):
    WICHTIG: Antworte AUSSCHLIESSLICH mit dem reinen JSON-Objekt. Verwende KEINE Markdown-Code-Blöcke (keine ```json) und KEINE einleitenden Sätze!

    Antworte NUR als JSON mit ALLEN Feldern:
    {{
      "valid": true/false,
      "hermeneutic_type": "paraphrase" | "meta" | "inference" | "hallucination" | "false_quote",
      "validity_category": "supported" | "contradiction" | "exaggeration" | "unsupported" | "temporal_fiction",
      "reason": "Kurze, präzise Begründung (1-2 Sätze)",
      "confidence": 0.0-1.0
    }}

  multisource_prompt: |
    Du bist ein hermeneutischer Validator für Multi-Quellen-Aussagen.

    AUFGABE: Prüfe, ob diese BEHAUPTUNG aus den QUELLEN kollektiv ableitbar ist.

    BEHAUPTUNG: "{claim}"

    QUELLEN (der Satz zitiert aus mehreren):
    {sources_text}

    ---

    ## CONFIDENCE-SKALA (ZUSÄTZLICH ZU valid):
      1.0  = Absolut sicher — Claim wird wörtlich und vollständig gestützt, kein Raum für Zweifel
      0.8  = Sehr sicher — Claim wird sinngemäß gestützt, leichte Paraphrasierung akzeptabel
      0.6  = Eher sicher — Claim wird gestützt, aber mit Implikationen oder kleinen Lücken
      0.4  = Unsicher — Claim wird teilweise gestützt, aber wesentliche Aspekte fehlen
      0.2  = Sehr unsicher — Kaum Stützung, große interpretatorische Sprünge nötig
      0.0  = Keine Stützung — Claim wird vom Text nicht gedeckt oder widersprochen
    
    WICHTIG: Wenn valid=true, darf confidence NICHT automatisch 1.0 sein.
    Ein Claim kann gültig sein, aber nur schwach gestützt (z.B. confidence: 0.6).
    Gib confidence als ehrliche Einschätzung der Stützungsqualität an.

    ## MULTI-QUELLEN-REGEL (KRITISCH):
    Ein Satz ist VALID, wenn:
    - Jedes wörtliche Zitat in MINDESTENS EINER der genannten Quellen vorkommt
    - Die Gesamtaussage eine valide Paraphrase oder Inferenz aus der Summe ist

    Ein Satz ist INVALID, wenn:
    - Ein wörtliches Zitat in KEINER der genannten Quellen vorkommt
    - Die Gesamtaussage dem Inhalt aller Quellen widerspricht

    ## AUSGABE-FORMAT (STRIKT):
    WICHTIG: Antworte AUSSCHLIESSLICH mit dem reinen JSON-Objekt. Verwende KEINE Markdown-Code-Blöcke (keine ```json) und KEINE einleitenden Sätze!

    Antworte NUR als JSON:
    {{
      "valid": true/false,
      "hermeneutic_type": "multi_source_synthesis" | "hallucination" | "false_quote",
      "validity_category": "supported" | "unsupported" | "contradiction",
      "reason": "Kurze Begründung: Welche Zitate sind belegt, welche nicht?",
      "confidence": 0.0-1.0
    }}

EXTRACTION:
  system_instructions: |
    Du bist ein präziser Zitat-Extraktor. Deine EINZIGE Aufgabe: Lies die Quellen und extrahiere zentrale Passagen, die für die Frage relevant sind.
    AUSGABEFORMAT (strikt JSON-Array):
    [
      {"quelle": 1, "text": "exakter Wortlaut aus dem Quelltext", "relevanz": "kurze Begründung"}
    ]
    REGELN:
    - Das Feld "text" MUSS ein exakter Substring aus dem Quelltext sein.
    - Kopiere buchstabengetreu — kein Kürzen, kein Umformulieren.
    - Maximal 8 Zitate. Gib NUR das JSON-Array zurück.
  mode_instructions: |
    FRAGE: {query}
    QUELLEN:
    {context_text}
    Extrahiere jetzt die relevantesten Passagen als JSON-Array.

# Neu: Familien-Regelwerk für Multi-Quellen-Analyse
family_rules:
  multi_source:
    comparative_rules: |
      GRUPPENVERGLEICH-ANWEISUNG:
      Die Quellen sind in Gruppen unterteilt (erkennbar am GRUPPE-Label
      im QUELLE-Header, z.B. "GRUPPE A: ..." oder "GRUPPE B: ...").
      Die GLOBALE SYNTHESE MUSS folgende Struktur haben:
      1. GRUPPE A ergibt: [Ergebnisse der Quellen in Gruppe A]
      2. GRUPPE B ergibt: [Ergebnisse der Quellen in Gruppe B]
      3. VERGLEICH: Was zeigt der Unterschied zwischen den Gruppen?
      4. ANTWORT auf die Forschungsfrage: Ja/Nein + Begründung.

    citation_rules: |
      AKADEMISCHE BEWEISFÜHRUNG: Deine Brillanz zeigt sich in der Präzision deiner Belege. Wenn du Begriffe in Anführungszeichen setzt oder Quellen [X] angibst, kopiere den Text EXAKT und buchstabengetreu aus dem jeweiligen Quell-Dokument. Ein einziges, perfekt wörtliches Zitat ist wertvoller als zehn paraphrasierte Behauptungen.

      ZITAT-REGEL:
      Verwende <ZITAT quelle="X">...</ZITAT> NUR für Texte, die du EXAKT aus den Quellen kopierst. Wenn du paraphrasierst, schreibe OHNE ZITAT-Tags: ...wie in Quelle [X] beschrieben. Ein präziser Verweis OHNE Zitat ist besser als ein erfundenes Zitat.

    chronology_rules: |
      CHRONOLOGIE-ZWANG: Deine Analyse MUSS der historischen Chronologie der Dokumente folgen. Du MUSST deine Synthese zwingend mit dem ersten (ältesten) Dokument im Kontext-Block beginnen und dich strikt zum letzten vorarbeiten. Die Nummerierung der QUELLEN im Kontext-Block ist die einzige gültige Reihenfolge.

    global_synthesis: |
      NACH ABSCHLUSS ALLER EINZELANALYSEN — GLOBALE SYNTHESE:
      Wenn du alle QUELLE [1] bis QUELLE [N] abgearbeitet hast, erstellst du einen abschließenden Synthese-Block mit der exakten Überschrift:

      ## GLOBALE SYNTHESE

      STRUKTUR:
      1. ENTWICKLUNGSLINIE: Wie verändern sich die Dokumente von QUELLE [1] bis [N]?
      2. KONVERGENZEN: Welche Erkenntnisse bestätigen sich über mehrere Dokumente?
      3. DIVERZENZEN: Wo widersprechen sich die Dokumente?
      4. STRUKTURELLES FAZIT: Zentraler Befund in einem Satz.
      Maximal 200 Wörter.

    global_synthesis_stilistic: |
      STILISTIC-MODUS — GLOBALE SYNTHESE (speziell für stilistische Analysen):
      Nach Abschluss aller Stil-Profile erstellst du die vergleichende Synthese
      mit der exakten Überschrift:

      ## GLOBALE SYNTHESE

      STRUKTUR:
      1. STILISTISCHE KONVERGENZEN: Welche stilistischen Mittel teilen sich die Texte?
         (Kadenz, Register, rhetorische Figuren, Wortwahl)
      2. STILISTISCHE DIVERZENZEN: Wo unterscheiden sie sich fundamental im Gestus?
         (Pragmatische Orientierung, Mündlichkeit vs. Schriftlichkeit,
         Gespräch vs. Befehl vs. Predigt)
      3. SPRACHLICHE WAHLVERWANDTSCHAFT: Welche stilistischen Affinitäten bestehen
         zwischen den Texten, die nicht auf inhaltlicher Nähe beruhen? Wo klingt
         etwas im einen Text an, das im anderen eine völlig andere Funktion erfüllt?
         (Goethes Konzept: Wahlverwandtschaft = Affinität trotz Verschiedenheit)
      4. STRUKTURELLES FAZIT: Ein Satz, der die stilistische Beziehung auf den
         Punkt bringt.
      Maximal 250 Wörter.


# ═══════════════════════════════════════════════════════════
# STILISTIC LAB v57.4 — ETAPPE 2+3: EINORDNEN + FREIER RAUM
# ═══════════════════════════════════════════════════════════
# Drei-Etappen-Architektur:
#   Etappe 1: SEZIEREN (Python, 0% LLM) — modules/text_analyzer.py
#   Etappe 2: EINORDNEN (LLM, pro Quelle) — 2-3 Beobachtungen
#   Etappe 3: FREIER RAUM (LLM, pro Quelle) — überraschende Funde
# Architektur-Entscheidung: Etappe 2+3 im selben Call (Priming-Verstärkung),
#   aber mit explizitem Bruch (verhindert Repetitions-Tendenz).
# ═══════════════════════════════════════════════════════════

stilistic_lab_etappe_2_3:
  system_instruction: |
    Beschreibe was du siehst. Beobachte auf der Wortoberfläche,
    dann auf der Satzebene, dann auf der Text-Ebene.
    Wirkung kommt zuletzt, wenn überhaupt.
    Du bist ein Annotator — kein Interpretieren, kein Deuten, kein Werten.
    Beobachte, was da ist. Nicht, was es bedeuten könnte.
    Nenne keine Schulen, keine Methoden, keine Namen.
    
    WICHTIG: Bestimme ZUERST den MODUS des Textes, BEVOR du analysierst.
    Der Modus bestimmt, welche Operationen du suchst.
    Mögliche Modi: Polemik, Beschwörung, Nachdenken, Erzählen, Spiel — oder etwas anderes.
  structure_template: |
    ETAPPE 2: BEOBACHTUNG — QUELLE [{source_id}]
    ═══════════════════════════════════════
    --- VORAB-DATEN (Python-Analyse, deterministisch) ---
    {python_stats}
    
    --- VERGLEICHSTABELLE (alle Quellen) ---
    {vergleichstabelle}
    
    --- ORIGINALTEXT (Auszug) ---
    {text_excerpt}
    
    ---
    
    MODUS:
    In welchem Modus spricht dieser Text? Benenne ihn zuerst.
    Der Modus bestimmt die Operation.
    
    DIE DOMINANTE:
    Was ist das stilistische Mittel, ohne das die anderen nicht funktionieren würden?
    
    DIE GRUNDOPERATION:
    Was tut dieser Text mit der Sprache?
    Der Modus bestimmt die Operation.
    (Beispiele: Verschiebung, Entlarvung, Verdichtung, Klangfügung, Abschweifung...)
    
    BEOBACHTUNG:
    Lies den Text von der Dominante UND der Grundoperation aus.
    2-3 Funde, je mit Beleg. Schreibe in Fließtext.
    
    ─── VERTIEFUNG ───
    Was wird erst sichtbar, wenn man die Dominante wegdenkt?
    
    FREIER RAUM:
    Was zeigt dieser Text über Sprache, das er nicht explizit thematisiert?
    
    RELATIONALE NOTIZ:
    Wie unterscheidet sich die Grundoperation dieses Textes von dem,
    was die Statistiken der anderen Quellen erwarten lassen? Ein Satz.
    
    STIL-TITEL:
    Max 8 Wörter, ein Gedankenstrich.
    
    ─── BRUCH ───
    
    ETAPPE 3: FREIER RAUM
    ═══════════════════
    2-3 Beobachtungen, die du bei Etappe 2 NICHT gemacht hast.
    Keine Wiederholungen. Überraschende Funde auf der Oberfläche.
    
    STIL-FAZIT (3 Sätze max):
    [Merkmal] — daher [Wirkung].
  compact_instruction: |
    WICHTIGE REGELN:
    - MODUS zuerst benennen, DANN erst analysieren.
    - BEOBACHTUNG: [Auffälligkeit] — [Funktion]. 25-40 Wörter.
    - BELEG: Kurzes Zitat. Max 15 Wörter.
    - GRUNDOPERATION: Der Modus bestimmt die Operation.
    - FREIER RAUM: Was du noch NICHT erwähnt hast.
    - STIL-FAZIT: Genau 1 Satz. [Merkmal] — daher [Wirkung].
    - Keine generischen Stilbeschreibungen.

stilistic_lab_synthese:
  system_instruction: |
    Du vergleichst Stile mehrerer Texte.
    Beschreibe Konvergenzen und Divergenzen auf der Wort- und Satzebene.
    Erlaubt: strukturelle Funktion ("Dieses Muster erzeugt Verdichtung").
    Verboten: Autorenabsichten ("Er wollte betonen").
    Du darfst die Autoren beim Namen nennen.
    Nenne keine Schulen, keine Methoden.
  structure_template: |
    VERGLEICHENDE STILBEOBACHTUNG
    ═══════════════════════════════════════
    --- KONZENTRAT (Dominante | Grundoperation | Modus | Titel pro Quelle) ---
    {konzentrat_block}
    
    --- VERGLEICHSTABELLE ---
    {vergleichstabelle}
    
    --- EINZELBEOBACHTUNGEN PRO QUELLE ---
    {einzelanalysen}
    
    ---
    
    GLOBALE SYNTHESE:
    
    HYPOTHESE:
    Formuliere die kühnste, aber noch plausible Behauptung,
    die dieser Vergleich ergibt. Sie muss falsifizierbar sein.
    Hinweis: Tynjanows Methode ist die relationale Frage.
    
    BEWEISFÜHRUNG:
    Entfalte die Hypothese. Belege jede Behauptung mit einem Zitat
    aus den Einzelanalysen.
    
    KENNZAHLEN-ÜBERRASCHUNG:
    Welche Zahl in den Einzelstatistiken stützt oder irritiert die Hypothese?
    Mindestens 2 Überraschungsbefunde.
    
    FREIER RAUM:
    Was zeigt der Vergleich über Sprache selbst?
    
    FAZIT:
    Bestätigung, Revision oder Verschärfung der Hypothese.
  compact_instruction: |
    WICHTIGE REGELN:
    - Jede Behauptung MUSS sich auf konkrete Daten beziehen.
    - HYPOTHESE zuerst, DANN Beweisführung.
    - KENNZAHLEN-ÜBERRASCHUNG: Mindestens 2 Befunde.
    - Keine inhaltlichen Vergleiche — nur sprachliche.
    - VERSCHIEBUNG ist die wichtigste Kategorie.
    - Keine generischen Schlussfolgerungen.
